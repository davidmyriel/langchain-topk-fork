name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - run: make lint
      - run: make test
      - run: make check_imports

  integration:
    # Runs only where the TOPK_API_KEY secret is configured (not on forks).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: test
    env:
      TOPK_API_KEY: ${{ secrets.TOPK_API_KEY }}
      TOPK_REGION: ${{ vars.TOPK_REGION || 'aws-us-east-1-elastica' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --extra fastembed
      - run: make integration_test
