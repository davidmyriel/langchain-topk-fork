[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-topk"
version = "0.1.0"
description = "An integration package connecting TopK and LangChain: semantic search with server-side embeddings, BM25, dense, sparse and multi-vector search, and true hybrid search in one query."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TopK Team", email = "support@topk.io" }]
keywords = [
    "langchain",
    "topk",
    "vector store",
    "vectorstore",
    "semantic search",
    "hybrid search",
    "bm25",
    "sparse vectors",
    "splade",
    "multi-vector",
    "colbert",
    "rag",
    "retrieval",
    "multi-tenant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "topk-sdk>=0.16.0,<1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.6.0"]

[project.urls]
Homepage = "https://topk.io"
Documentation = "https://docs.topk.io"
Repository = "https://github.com/topk-io/langchain-topk"
Issues = "https://github.com/topk-io/langchain-topk/issues"
Changelog = "https://github.com/topk-io/langchain-topk/releases"
Console = "https://console.topk.io"

[dependency-groups]
test = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "langchain-tests>=1.0.0,<2.0.0",
    "langchain-classic>=1.0.0,<2.0.0",
    "lark>=1.1.0,<2.0.0",
]
test_integration = []
lint = ["ruff>=0.13.1,<0.14.0"]
typing = ["mypy>=1.15.0,<2.0.0"]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["langchain_topk"]

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "N", "S", "T201", "RUF"]
ignore = [
    "D100",  # module docstrings
    "D105",  # magic method docstrings
    "D107",  # __init__ docstrings (documented on the class)
    "S101",  # assert (tests)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "T201", "N802"]
"scripts/**" = ["D", "T201", "S"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
